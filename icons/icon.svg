<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Crescent moon -->
  <path d="M 44 32 C 60 32 72 44 72 60 C 72 76 60 88 44 88 C 40 88 36.5 87 33 85 C 47 79 53 66 51 51 C 49 39 40 34 33 35 C 36.5 33 40 32 44 32 Z" 
        fill="url(#moonGrad)" filter="url(#glow)" />

  <!-- Protective Eye contour -->
  <path d="M 52 74 C 64 60 86 60 98 74 C 86 88 64 88 52 74 Z" 
        fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Iris -->
  <circle cx="75" cy="74" r="9" fill="url(#irisGrad)" />

  <!-- Sparkle / Pupil -->
  <circle cx="73" cy="72" r="3.5" fill="#ffffff" />
  
  <!-- Subtle night stars -->
  <circle cx="92" cy="38" r="1.5" fill="#fef3c7" opacity="0.8" />
  <circle cx="82" cy="28" r="1" fill="#fef3c7" opacity="0.6" />
</svg>
